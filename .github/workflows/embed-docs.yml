name: Embed docs for AI search

# Manual only. A full re-embed of the site costs real OpenAI usage, so this
# never runs on push/PR — trigger it deliberately from the Actions tab. The
# produced JSONL artifact is handed to grafx-genie's private ingest workflow
# (AIML-36) through a GitHub App-authenticated workflow dispatch.
#
# Per AIML-37 this embeds ALL products including GraFx-Publisher, which the
# public search box excludes (see hooks.py EXCLUDE_PREFIXES). The AI store
# intentionally indexes more than the on-site search — this divergence is by
# ticket requirement, not an oversight.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max pages to embed (blank = whole site)"
        required: false
        default: ""

# The repository token is only used to check out this public repository. The
# private cross-repository dispatch uses a separately scoped GitHub App token.
permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    name: Chunk + embed documentation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Embed documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCS_EMBEDDING_MODEL: text-embedding-3-large
          DOCS_EMBEDDING_DIM: "3072"
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/embed_docs.py --out build/doc_records.jsonl $LIMIT_ARG

      - name: Upload embedding records
        uses: actions/upload-artifact@v7
        with:
          name: doc-records
          path: build/doc_records.jsonl
          retention-days: 7

  dispatch-ingest-main:
    name: Dispatch documentation ingest to MAIN
    needs: embed
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID_CHILI_INFRA_WORKFLOW_DISPATCHER }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_CHILI_INFRA_WORKFLOW_DISPATCHER }}
          owner: ${{ github.repository_owner }}
          repositories: grafx-genie
          permission-actions: write

      - name: Dispatch private ingest workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'grafx-genie',
              workflow_id: 'docs-ingest.yml',
              ref: 'main',
              inputs: {
                'artifact-name': 'doc-records',
                'artifact-run-id': '${{ github.run_id }}',
                target: 'MAIN',
              },
            })